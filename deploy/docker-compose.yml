version: "3.8"

services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: [redis_data:/data]
    restart: unless-stopped

  etcd:
    image: quay.io/coreos/etcd:v3.5.0
    ports: ["2379:2379"]
    environment:
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd:2379
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
    volumes: [etcd_data:/etcd-data]
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    ports: ["3306:3306"]
    environment:
      MYSQL_ROOT_PASSWORD: ragent_root
      MYSQL_DATABASE: ragent
      MYSQL_USER: ragent
      MYSQL_PASSWORD: ragent_pass
    volumes: [mysql_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build: { context: .., dockerfile: deploy/Dockerfile.api }
    ports: ["15722:15722"]
    environment: [REDIS_ADDR=redis:6379, ETCD_HOSTS=etcd:2379]
    depends_on: [redis, etcd, provider, router, proxy]
    restart: unless-stopped

  provider:
    build: { context: .., dockerfile: deploy/Dockerfile.provider }
    ports: ["8081:8081"]
    environment: [REDIS_ADDR=redis:6379, ETCD_HOSTS=etcd:2379]
    depends_on: [redis, etcd, mysql]
    restart: unless-stopped

  router:
    build: { context: .., dockerfile: deploy/Dockerfile.router }
    ports: ["8082:8082"]
    environment: [REDIS_ADDR=redis:6379, ETCD_HOSTS=etcd:2379]
    depends_on: [redis, etcd]
    restart: unless-stopped

  proxy:
    build: { context: .., dockerfile: deploy/Dockerfile.proxy }
    ports: ["8083:8083"]
    environment: [REDIS_ADDR=redis:6379, ETCD_HOSTS=etcd:2379]
    depends_on: [redis, etcd, provider]
    restart: unless-stopped

volumes:
  redis_data:
  etcd_data:
  mysql_data:
