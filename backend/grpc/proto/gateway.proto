syntax = "proto3";

package ragent.grpc;

option go_package = "github.com/ragent/router/grpc/proto";

// GatewayService 是 AI API 网关的 gRPC 服务定义。
//
// 提供三种 RPC 模式：
//   - Unary: GetStatus, ClassifyIntent
//   - Server Streaming: StreamMetrics
service GatewayService {
  // GetStatus 获取网关运行状态（Unary RPC）。
  rpc GetStatus(StatusRequest) returns (StatusResponse);

  // StreamMetrics 实时推送网关指标（Server Streaming RPC）。
  // 客户端订阅后，服务端持续推送 MetricsUpdate 直到客户端断开。
  rpc StreamMetrics(MetricsRequest) returns (stream MetricsUpdate);

  // ClassifyIntent 对用户提示词进行意图分类（Unary RPC）。
  // 返回路由引擎选择的供应商、策略和置信度。
  rpc ClassifyIntent(ClassifyRequest) returns (ClassifyResponse);
}

// StatusRequest 获取状态请求（当前无参数，保留扩展位）。
message StatusRequest {}

// StatusResponse 网关状态响应。
message StatusResponse {
  string version = 1;            // 网关版本号
  int64 uptime_seconds = 2;     // 运行时长（秒）
  int64 total_requests = 3;     // 累计处理请求数
  int32 active_requests = 4;    // 当前活跃请求数
  int32 provider_count = 5;     // 已注册供应商数
  bool healthy = 6;             // 整体健康状态
  double error_rate = 7;        // 最近窗口错误率
}

// MetricsRequest 订阅指标流的请求（当前无参数，保留扩展位）。
message MetricsRequest {}

// MetricsUpdate 单次指标更新（流式推送）。
message MetricsUpdate {
  int64 timestamp = 1;           // Unix 时间戳（毫秒）
  double requests_per_sec = 2;   // 每秒请求数（QPS）
  double avg_latency_ms = 3;     // 平均延迟（毫秒）
  double error_rate = 4;         // 错误率
  int32 active_requests = 5;     // 当前活跃请求数
}

// ClassifyRequest 意图分类请求。
message ClassifyRequest {
  string prompt = 1;              // 用户提示词
  string model = 2;              // 请求的模型名（可选）
}

// ClassifyResponse 意图分类响应。
message ClassifyResponse {
  string matched_provider = 1;   // 匹配的供应商名
  string strategy = 2;           // 路由策略: keyword / embedding / llm / fallback
  double confidence = 3;         // 分类置信度 (0.0-1.0)
  int64 latency_ms = 4;          // 分类耗时（毫秒）
}
